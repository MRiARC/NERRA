# NERRA development infrastructure.
# Postgres (pgvector) + Neo4j Graph DB run in Docker — FastAPI and Next.js
# run locally with hot reload.
name: nerra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nerra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nerra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nerra}
    ports:
      # Host port 5434 — avoids collision with other local postgres instances.
      - "5434:5432"
    volumes:
      - nerra_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nerra} -d ${POSTGRES_DB:-nerra}"]
      interval: 5s
      timeout: 3s
      retries: 12

  neo4j:
    image: neo4j:5-community
    container_name: nerra-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/nerra_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      # Browser UI: http://localhost:7474 | Bolt protocol: bolt://localhost:7687
      - "7474:7474"
      - "7687:7687"
    volumes:
      - nerra_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p nerra_dev_password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nerra_pgdata:
  nerra_neo4j_data:
